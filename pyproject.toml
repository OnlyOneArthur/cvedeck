[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cvedeck"
version = "0.1.0"
description = "Local terminal dashboard for authoritative CVE intelligence and security news"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Arthur"}]
dependencies = [
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "textual>=1.0,<2",
  "tomli-w>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
cvedeck = "cvedeck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cvedeck = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: opt-in checks against public upstream services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cvedeck"]

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true
